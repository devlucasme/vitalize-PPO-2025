services:
  backend:
    build:
      context: .  
    image: vitalize_backend:latest
    container_name: objective-shamir
    env_file:
      - ./.env
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: vitalize_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data: